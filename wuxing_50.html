<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五行藏象分类 · 50题挑战</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f1ea;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
            /* 限制最大高度，防止错题太多撑爆屏幕 */
            max-height: 85vh;
            overflow-y: auto;
        }
        h1 {
            font-size: 18px;
            color: #5a4a3a;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .score {
            font-size: 15px;
            color: #8c7a6b;
            margin-bottom: 15px;
        }
        .q-box {
            background-color: #f9f6f0;
            padding: 25px 10px;
            border-radius: 8px;
            border: 1px solid #e0d6c8;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .q-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }
        .q-text {
            font-size: 32px;
            font-weight: bold;
            color: #3e3226;
        }
        .btns {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        .btn {
            flex: 1;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; }
        
        /* 五行颜色 */
        .mu { background-color: #4CAF50; }
        .huo { background-color: #F44336; }
        .tu { background-color: #FFC107; color: #333; }
        .jin { background-color: #FFFFFF; color: #000000; border: 1px solid #ccc; }
        .shui { background-color: #000000; color: #FFFFFF; }
        
        .msg {
            height: 25px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .green { color: #4CAF50; }
        .red { color: #F44336; }
        
        .restart {
            margin-top: 15px;
            padding: 10px 20px;
            background: #5a4a3a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        
        /* 错题本样式 */
        .review-box {
            display: none; /* 默认隐藏 */
            text-align: left;
            margin-top: 20px;
            border-top: 2px dashed #e0d6c8;
            padding-top: 15px;
        }
        .review-title {
            font-size: 18px;
            font-weight: bold;
            color: #5a4a3a;
            margin-bottom: 10px;
            text-align: center;
        }
        .review-item {
            background-color: #fff5f5;
            border-left: 4px solid #F44336;
            padding: 8px 10px;
            margin-bottom: 8px;
            font-size: 14px;
            border-radius: 0 4px 4px 0;
        }
        .review-item .wrong { color: #F44336; font-weight: bold; }
        .review-item .right { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

<div class="box" id="main-box">
    <h1>天人一体藏象系统 · 50题挑战</h1>
    <div class="score">进度: <span id="progress">0</span> / 50 | 得分: <span id="score">0</span></div>

    <!-- 游戏区 -->
    <div id="game-area">
        <div class="q-box">
            <div class="q-label" id="q-category">正在加载...</div>
            <div class="q-text" id="q-text">...</div>
        </div>

        <div class="btns">
            <button class="btn mu" onclick="answer('木')">木</button>
            <button class="btn huo" onclick="answer('火')">火</button>
            <button class="btn tu" onclick="answer('土')">土</button>
            <button class="btn jin" onclick="answer('金')">金</button>
            <button class="btn shui" onclick="answer('水')">水</button>
        </div>

        <div class="msg" id="msg"></div>
    </div>

    <!-- 结果与错题区 -->
    <div id="result-area" style="display: none;">
        <h2 id="final-score-text" style="color:#5a4a3a;">游戏结束</h2>
        <div class="review-box" id="review-box">
            <div class="review-title">📝 错题回顾</div>
            <div id="review-list"></div>
        </div>
    </div>

    <button class="restart" id="restart-btn" onclick="startGame()" style="display: none;">重新挑战</button>
</div>

<script type="text/javascript">
    // 完整数据
    var rawData = {
        '木': ['角', '酸', '青', '生', '风', '东', '春', '肝', '胆', '目', '筋', '怒', '泪', '弦'],
        '火': ['徵', '苦', '赤', '长', '暑', '南', '夏', '心', '小肠', '舌', '脉', '喜', '汗', '洪'],
        '土': ['宫', '甘', '黄', '化', '湿', '中', '长夏', '脾', '胃', '口', '肉', '思', '涎', '缓'],
        '金': ['商', '辛', '白', '收', '燥', '西', '秋', '肺', '大肠', '鼻', '皮', '悲', '涕', '浮'],
        '水': ['羽', '咸', '黑', '藏', '寒', '北', '冬', '肾', '膀胱', '耳', '骨', '恐', '唾', '沉']
    };

    var categories = ['五音', '五味', '五色', '五化', '五气', '五方', '五季', '五脏', '五腑', '五官', '五体', '五志', '五液', '五脉'];

    var pool = [];       
    var current = null;  
    var score = 0;
    var total = 0;
    var lock = false;
    var wrongList = []; // 存储错题

    function startGame() {
        pool = [];
        score = 0;
        total = 0;
        lock = false;
        wrongList = [];
        
        // 重置界面
        document.getElementById('game-area').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('restart-btn').style.display = 'none';
        document.getElementById('progress').innerText = '0';
        document.getElementById('score').innerText = '0';
        document.getElementById('msg').innerText = '';
        document.getElementById('msg').className = 'msg';

        // 生成所有题目池
        var allQuestions = [];
        for (var wuxing in rawData) {
            if (rawData.hasOwnProperty(wuxing)) {
                var arr = rawData[wuxing];
                for (var i = 0; i < arr.length; i++) {
                    if (arr[i] !== wuxing) {
                        allQuestions.push({ text: arr[i], ans: wuxing, cat: categories[i] });
                    }
                }
            }
        }
        
        // 打乱全部题目
        allQuestions.sort(function() { return Math.random() - 0.5; });
        
        // 截取前50题作为本次挑战
        pool = allQuestions.slice(0, 50);
        
        nextQuestion();
    }

    function nextQuestion() {
        // 题目答完，进入结算界面
        if (pool.length === 0) {
            showResult();
            return;
        }
        
        lock = false;
        current = pool.pop();
        
        document.getElementById('q-category').innerText = '考察项目：' + current.cat;
        document.getElementById('q-text').innerText = current.text;
        document.getElementById('msg').innerText = '';
        
        var btns = document.querySelectorAll('.btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = false;
        }
    }

    function answer(choice) {
        if (lock || !current) return;
        lock = true;
        
        // 当前题目是 current，记录到总数
        total++;
        document.getElementById('progress').innerText = total;
        
        var msg = document.getElementById('msg');
        var isCorrect = (choice === current.ans);
        
        if (isCorrect) {
            score++;
            document.getElementById('score').innerText = score;
            msg.innerText = '✅ 正确！';
            msg.className = 'msg green';
        } else {
            msg.innerText = '❌ 错误，正确答案是: ' + current.ans;
            msg.className = 'msg red';
            
            // 记录错题
            wrongList.push({
                text: current.text,
                cat: current.cat,
                userAns: choice,
                correctAns: current.ans
            });
        }
        
        // 禁用按钮
        var btns = document.querySelectorAll('.btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = true;
        }
        
        // 如果是最后一题，延迟长一点再结算，让用户看到对错
        var delayTime = (pool.length === 0) ? 1500 : 800;
        setTimeout(nextQuestion, delayTime);
    }

    function showResult() {
        // 隐藏游戏区，显示结算区
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'inline-block';
        
        // 计算正确率
        var rate = total > 0 ? Math.round((score / total) * 100) : 0;
        var finalScoreText = document.getElementById('final-score-text');
        
        if (wrongList.length === 0) {
            finalScoreText.innerHTML = '🎉 太棒了！满分 ' + score + ' / ' + total + '！<br>您已完全掌握五行藏象！';
            document.getElementById('review-box').style.display = 'none';
        } else {
            finalScoreText.innerHTML = '挑战结束！<br>得分: ' + score + ' / ' + total + ' | 正确率: ' + rate + '%';
            document.getElementById('review-box').style.display = 'block';
            renderWrongList();
        }
    }

    function renderWrongList() {
        var listContainer = document.getElementById('review-list');
        listContainer.innerHTML = '';
        
        for (var i = 0; i < wrongList.length; i++) {
            var item = wrongList[i];
            var div = document.createElement('div');
            div.className = 'review-item';
            // 格式化输出：考察项目 -> 题目（您的答案：X，正确答案：Y）
            div.innerHTML = '【' + item.cat + '】' + item.text + 
                            ' —— 您的答案: <span class="wrong">' + item.userAns + '</span>' + 
                            '，正确答案: <span class="right">' + item.correctAns + '</span>';
            listContainer.appendChild(div);
        }
    }

    // 立即启动
    startGame();
</script>

</body>
</html>
