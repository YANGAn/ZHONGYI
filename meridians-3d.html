<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>子午流注 · 经络时钟 3D 演示</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#14181c; --panel:#1b2126; --panel2:#20272d; --text:#e8e4da; --muted:#8b939b; --line:#333c43;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Songti SC","Noto Serif SC",serif;overflow:hidden;display:flex;flex-direction:column}

/* 顶部 3D 区域 */
header{padding:10px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.02em}
.info-board{font-family:-apple-system,"PingFang SC",sans-serif;text-align:right}
.info-board div{margin-bottom:6px;font-size:13px;color:var(--muted)}
.info-board span{font-weight:bold;color:var(--text)}

#canvas-wrap{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(20,24,28,.6);padding:4px 8px;border-radius:6px;pointer-events:none}

/* ================= 底部区域 ================= */
#bottom-section{
  flex:0 0 240px; 
  height: 240px;
  background:var(--panel);border-top:2px solid var(--line);
  display:flex;
  overflow: hidden; 
}

/* 左侧表盘 */
#clock-area{
  flex:0 0 260px; 
  display:flex;justify-content:center;align-items:center;
  border-right:1px solid var(--line);
  position:relative;
  user-select:none;
}
#clock-container{
  position:relative;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, #20272d 0%, #14181c 100%);
  box-shadow:inset 0 0 20px rgba(0,0,0,0.8), 0 4px 15px rgba(0,0,0,0.5);
  border:1px solid #333;
  cursor:grab;
}
#clock-container:active{cursor:grabbing}
.center-dot{position:absolute;top:50%;left:50%;width:8px;height:8px;background:#e8e4da;border-radius:50%;transform:translate(-50%,-50%);z-index:10;box-shadow:0 0 10px #fff;pointer-events:none}

/* 表盘文字 */
.zhi-text{
  position:absolute;top:50%;left:50%;
  font-size:11px;font-family:-apple-system,"PingFang SC",sans-serif;
  color:var(--muted);text-align:center;line-height:1.2;
  transition:color 0.3s, text-shadow 0.3s;
  pointer-events:none;
  width: 54px; 
}
.zhi-text.active{color:#fff;font-weight:bold;text-shadow:0 0 8px var(--active-color);}
.zhi-text.prev{color:#ffd54f;}

/* 时钟指针（已缩短） */
#clock-hand{
  position:absolute;top:50%;left:50%;width:4px;height:55px;background:#e8e4da;
  transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);
  border-radius:4px;z-index:5;pointer-events:none;
  box-shadow:0 0 10px rgba(255,255,255,0.3);
}
#clock-hand::after{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:14px;height:14px;background:#e8e4da;border-radius:50%;
  box-shadow:0 0 10px rgba(255,255,255,0.5);
}
.clock-tick{position:absolute;top:50%;left:50%;width:2px;height:6px;background:#555;transform-origin:0 0;z-index:1;pointer-events:none}
.drag-hint{position:absolute;bottom:2px;width:100%;text-align:center;font-size:10px;color:var(--muted);font-family:sans-serif;pointer-events:none}

/* ================= 右侧穴位小框 ================= */
#detail-area{
  flex:1; 
  min-width:0; 
  padding: 12px 15px; 
  display:flex;
  flex-direction:column;
  height: 100%; 
}

.detail-box {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  flex: 1; 
  overflow: hidden; 
}

.d-head {
  display:flex; align-items:center; gap:8px;
  padding: 8px 12px;
  border-bottom:1px solid var(--line);
  background: #1b2126;
  flex: 0 0 auto;
}
.d-head .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.d-head h3{margin:0;font-size:14px;flex:1;color:var(--text);}
.d-head span{font-size:11px;color:var(--muted);}

#detail-list {
  flex: 1;
  overflow-y: auto; 
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 6px;
}
#detail-list::-webkit-scrollbar { width: 6px; }
#detail-list::-webkit-scrollbar-track { background: transparent; }
#detail-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
#detail-list::-webkit-scrollbar-thumb:hover { background: #666; }

.acupoint{
  background:var(--panel); border:1px solid var(--line);
  padding:4px 8px; border-radius:4px; font-size:12px; color:var(--text);
  white-space: nowrap;
}
.acupoint span{color:var(--muted); font-size:10px; margin-right:4px;}

@media (max-width:680px){
  #bottom-section{height: 210px; flex:0 0 210px;}
  #clock-area{flex:0 0 210px;}
  #clock-container{width:160px;height:160px;}
  #clock-hand{height:45px} /* 手机端指针更短 */
  .zhi-text{width:44px;font-size:10px;}
  #detail-area{padding: 10px;}
}
</style>
</head>
<body>

<header>
  <h1>子午流注 · 经络时钟</h1>
  <div class="info-board">
    <div>当前流注: <span id="cur-info" style="color:#ffd54f">--</span></div>
    <div>上一个时辰: <span id="prev-info">--</span></div>
  </div>
</header>

<div id="canvas-wrap">
  <div id="hint">拖动旋转 · 滚轮/双指缩放 · 当前经络有流光，上一经络亮起实线</div>
</div>

<div id="bottom-section">
  <div id="clock-area">
    <div id="clock-container">
      <div id="clock-hand"></div>
      <div class="center-dot"></div>
    </div>
    <div class="drag-hint">👆 拨动表盘</div>
  </div>
  
  <div id="detail-area">
    <div class="detail-box">
      <div class="d-head">
        <span class="dot" id="detail-dot"></span>
        <h3 id="detail-title">手太阴肺经</h3>
        <span id="detail-count">共 11 穴</span>
      </div>
      <div id="detail-list"></div>
    </div>
  </div>
</div>

<script>
const SHICHEN = [

  { zhi: "丑", id: "LR", name: "足厥阴肝经", color: 0x8FA83E, angle: 30 },
  { zhi: "寅", id: "LU", name: "手太阴肺经", color: 0xE8B4A0, angle: 60 },

const M = [
{id:"LU",cn:"手太阴肺经",grp:"手三阴",color:0xE8B4A0,pts:[[1.0,14.5,1.4],[2.3,16.0,0.6],[3.7,12.3,1.0],[4.6,8.6,1.3],[4.9,6.8,1.4]],names:"中府 云门 天府 侠白 尺泽 孔最 列缺 经渠 太渊 鱼际 少商".split(" ")},
{id:"PC",cn:"手厥阴心包经",grp:"手三阴",color:0x6B8FA3,pts:[[0.8,14.3,1.6],[2.3,16.0,0.2],[3.7,12.3,0.6],[4.6,8.6,0.9],[4.9,6.8,1.0]],names:"天池 天泉 曲泽 郄门 间使 内关 大陵 劳宫 中冲".split(" ")},
{id:"HT",cn:"手少阴心经",grp:"手三阴",color:0xC0596B,pts:[[1.0,15.0,0.0],[2.3,16.0,-0.2],[3.7,12.3,0.2],[4.6,8.6,0.5],[4.9,6.8,0.6]],names:"极泉 青灵 少海 灵道 通里 阴郄 神门 少府 少冲".split(" ")},
{id:"LI",cn:"手阳明大肠经",grp:"手三阳",color:0xD4956B,pts:[[5.2,6.8,1.4],[4.9,8.6,1.3],[4.3,12.3,1.4],[2.9,16.0,0.6],[1.6,17.0,0.6],[0.5,18.2,1.8]],names:"商阳 二间 三间 合谷 阳溪 偏历 温溜 下廉 上廉 手三里 曲池 肘髎 手五里 臂臑 肩髃 巨骨 天鼎 扶突 口禾髎 迎香".split(" ")},
{id:"SJ",cn:"手少阳三焦经",grp:"手三阳",color:0x7FA093,pts:[[5.2,6.8,1.0],[4.9,8.6,0.9],[4.3,12.3,1.0],[2.9,16.0,0.2],[1.8,17.3,0.2],[2.4,18.2,0.1],[1.0,18.9,1.2]],names:"关冲 液门 中渚 阳池 外关 支沟 会宗 三阳络 四渎 天井 清冷渊 消泺 臑会 肩髎 天髎 天牖 翳风 瘈脉 颅息 角孙 耳门 耳和髎 丝竹空".split(" ")},
{id:"SI",cn:"手太阳小肠经",grp:"手三阳",color:0x9C5B7A,pts:[[5.2,6.8,0.6],[4.9,8.6,0.5],[4.3,12.3,0.6],[2.9,16.0,-0.2],[1.6,17.0,-0.3],[2.3,18.0,-0.2],[2.0,18.3,0.3]],names:"少泽 前谷 后溪 腕骨 阳谷 养老 支正 小海 肩贞 臑俞 天宗 秉风 曲垣 肩外俞 肩中俞 天窗 天容 颧髎 听宫".split(" ")},
{id:"ST",cn:"足阳明胃经",grp:"足三阳",color:0xD9A441,pts:[[0.5,18.3,1.9],[0.3,17.0,1.3],[0.6,15.0,1.6],[0.7,11.0,1.5],[1.7,8.0,0.5],[1.7,4.0,1.0],[1.6,0.9,0.9],[1.6,0.3,2.2]],names:"承泣 四白 巨髎 地仓 大迎 颊车 下关 头维 人迎 水突 气舍 缺盆 气户 库房 屋翳 膺窗 乳中 乳根 不容 承满 梁门 关门 太乙 滑肉门 天枢 外陵 大巨 水道 归来 气冲 髀关 伏兔 阴市 梁丘 犊鼻 足三里 上巨虚 条口 下巨虚 丰隆 解溪 冲阳 陷谷 内庭 厉兑".split(" ")},
{id:"GB",cn:"足少阳胆经",grp:"足三阳",color:0x6FA05B,pts:[[1.9,18.5,0.6],[2.5,18.7,-0.3],[1.8,19.0,-0.7],[1.4,17.0,-0.6],[2.0,13.0,0.0],[1.9,9.0,0.1],[1.6,8.0,0.0],[1.7,4.0,0.4],[1.7,0.9,0.3],[1.6,0.3,2.0]],names:"瞳子髎 听会 上关 颔厌 悬颅 悬厘 曲鬓 率谷 天冲 浮白 头窍阴 完骨 本神 阳白 头临泣 目窗 正营 承灵 脑空 风池 肩井 渊腋 辄筋 日月 京门 带脉 五枢 维道 居髎 环跳 风市 中渎 膝阳关 阳陵泉 阳交 外丘 光明 阳辅 悬钟 丘墟 足临泣 地五会 侠溪 足窍阴".split(" ")},
{id:"BL",cn:"足太阳膀胱经",grp:"足三阳",color:0x4A7A9C,pts:[[0.3,18.6,1.5],[0,20.3,0],[0,17.0,-0.9],[0.9,13.0,-1.6],[0.9,9.0,-1.4],[1.6,7.5,-1.0],[1.7,4.0,-0.2],[1.7,0.9,-0.3],[1.4,0.3,1.6]],names:"睛明 攒竹 眉冲 曲差 五处 承光 通天 络却 玉枕 天柱 大杼 风门 肺俞 厥阴俞 心俞 督俞 膈俞 肝俞 胆俞 脾俞 胃俞 三焦俞 肾俞 气海俞 大肠俞 关元俞 小肠俞 膀胱俞 中膂俞 白环俞 上髎 次髎 中髎 下髎 会阳 承扶 殷门 浮郄 委阳 委中 附分 魄户 膏肓 神堂 譩譆 膈关 魂门 阳纲 意舍 胃仓 肓门 志室 胞肓 秩边 合阳 承筋 承山 飞扬 跗阳 昆仑 仆参 申脉 金门 京骨 束骨 足通谷 至阴".split(" ")},
{id:"SP",cn:"足太阴脾经",grp:"足三阴",color:0xB8A339,pts:[[1.1,0.3,1.9],[1.1,0.9,-0.1],[1.1,4.0,-0.2],[1.0,8.0,-0.4],[1.0,11.0,1.0],[1.6,15.6,0.8]],names:"隐白 大都 太白 公孙 商丘 三阴交 漏谷 地机 阴陵泉 血海 箕门 冲门 府舍 腹结 大横 腹哀 食窦 天溪 胸乡 周荣 大包".split(" ")},
{id:"LR",cn:"足厥阴肝经",grp:"足三阴",color:0x8FA83E,pts:[[1.2,0.3,1.5],[1.15,0.9,-0.25],[1.15,4.0,-0.35],[1.05,8.0,-0.55],[1.3,14.5,0.6]],names:"大敦 行间 太冲 中封 蠡沟 中都 膝关 曲泉 阴包 足五里 阴廉 急脉 章门 期门".split(" ")},
{id:"KI",cn:"足少阴肾经",grp:"足三阴",color:0x3F5F8A,pts:[[1.2,0.15,0.0],[1.2,0.9,-0.4],[1.2,4.0,-0.5],[1.1,8.0,-0.7],[0.6,10.0,0.9],[0.9,14.8,1.0]],names:"涌泉 然谷 太溪 大钟 水泉 照海 复溜 交信 筑宾 阴谷 横骨 大赫 气穴 四满 中注 肓俞 商曲 石关 阴都 腹通谷 幽门 步廊 神封 灵墟 神藏 彧中 俞府".split(" ")}
];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14181c);
const wrap=document.getElementById('canvas-wrap');
const camera=new THREE.PerspectiveCamera(42,1,0.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
wrap.appendChild(renderer.domElement);
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

scene.add(new THREE.AmbientLight(0xffffff,0.65));
const dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(6,20,10);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.35);dl2.position.set(-8,5,-10);scene.add(dl2);

const target=new THREE.Vector3(0,10,0);
let theta=0.6,phi=1.25,radius=32;
function updateCam(){
  camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
updateCam();

const bodyMat=new THREE.MeshStandardMaterial({color:0x9aa4ac,transparent:true,opacity:0.16,roughness:0.9});
const body=new THREE.Group();
function limb(p1,p2,r1,r2){
  const a=new THREE.Vector3(...p1),b=new THREE.Vector3(...p2);
  const dir=new THREE.Vector3().subVectors(b,a);const len=dir.length();
  const geo=new THREE.CylinderGeometry(r2,r1,len,14);
  const mesh=new THREE.Mesh(geo,bodyMat);
  const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  return mesh;
}
body.add(new THREE.Mesh(new THREE.SphereGeometry(1.5,20,16),bodyMat).translateOnAxis(new THREE.Vector3(0,1,0),18.3));
body.add(limb([0,17,0],[0,10.5,0],2.0,1.9));
body.add(limb([0,10.5,0],[0,7.5,0],1.9,1.6));
[1,-1].forEach(s=>{
  body.add(limb([s*2.6,16,0.2],[s*4.0,12.3,0.6],0.55,0.45));
  body.add(limb([s*4.0,12.3,0.6],[s*4.9,8.6,0.9],0.42,0.35));
  body.add(limb([s*1.3,8.0,0],[s*1.4,4.0,0.4],0.85,0.6));
  body.add(limb([s*1.4,4.0,0.4],[s*1.4,0.9,0.3],0.55,0.4));
  const hand=new THREE.Mesh(new THREE.SphereGeometry(0.4,10,10),bodyMat);
  hand.position.set(s*4.95,6.8,1.0);
  body.add(hand);
});
scene.add(body);

const groupsByM={};
const flowTextures = {}; 

M.forEach(m=>{
  const pts=m.pts.map(p=>new THREE.Vector3(...p));
  const g=new THREE.Group();
  
  [1,-1].forEach(s=>{
    const spts=pts.map(p=>new THREE.Vector3(p.x*s,p.y,p.z));
    const curve=new THREE.CatmullRomCurve3(spts);
    const tubeGeo = new THREE.TubeGeometry(curve,80,0.12,8,false); 
    
    const baseMat = new THREE.MeshStandardMaterial({
      color: m.color, transparent: true, opacity: 0.0, roughness: 0.5
    });
    const tube = new THREE.Mesh(tubeGeo, baseMat);
    g.add(tube);

    const canvas = document.createElement('canvas');
    canvas.width = 128; 
    canvas.height = 32; 
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, 128, 32);
    const hex = '#' + m.color.toString(16).padStart(6, '0');
    const grad = ctx.createLinearGradient(0, 0, 128, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.3, hex);
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(0.7, hex);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 32);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(4, 1); 
    
    const flowMat = new THREE.MeshBasicMaterial({
      map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0
    });
    
    const flowTube = new THREE.Mesh(tubeGeo, flowMat);
    flowTube.scale.set(1.05, 1.05, 1.05);
    g.add(flowTube);

    if(!flowTextures[m.id]) flowTextures[m.id] = [];
    flowTextures[m.id].push(texture);
  });
  
  scene.add(g);
  groupsByM[m.id]=g;
});

let dragging=false,lx=0,ly=0;
function down(x,y){dragging=true;lx=x;ly=y;}
function move(x,y){if(!dragging)return;theta-=(x-lx)*0.006;phi=Math.max(0.35,Math.min(2.6,phi-(y-ly)*0.006));lx=x;ly=y;updateCam();}
function up(){dragging=false;}
renderer.domElement.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
window.addEventListener('mouseup',up);
renderer.domElement.addEventListener('touchstart',e=>{const t=e.touches[0];down(t.clientX,t.clientY);},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
renderer.domElement.addEventListener('touchend',up);
renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(14,Math.min(60,radius+e.deltaY*0.03));updateCam();e.preventDefault();},{passive:false});

const clockContainer = document.getElementById('clock-container');
const clockHand = document.getElementById('clock-hand');
const textElements = [];

SHICHEN.forEach((sc, index) => {
    const textDiv = document.createElement('div');
    textDiv.className = 'zhi-text';
    const radius = 80; 
    const rad = (sc.angle - 90) * Math.PI / 180;
    const tx = Math.cos(rad) * radius;
    const ty = Math.sin(rad) * radius;
    
    textDiv.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
    textDiv.innerHTML = `${sc.zhi}时<br><span style="font-size:9px">${sc.name}</span>`;
    clockContainer.appendChild(textDiv);
    textElements.push(textDiv);

    const tick = document.createElement('div');
    tick.className = 'clock-tick';
    tick.style.transform = `rotate(${sc.angle}deg) translateY(-100px)`;
    clockContainer.appendChild(tick);
});

let currentIndex = 2; 
let currentContinuousAngle = 60; 

function renderDetail(sc) {
    const hexColor = '#' + sc.color.toString(16).padStart(6, '0');
    document.getElementById('detail-dot').style.background = hexColor;
    document.getElementById('detail-title').innerText = sc.name;
    
    const mData = M.find(m => m.id === sc.id);
    const listDiv = document.getElementById('detail-list');
    listDiv.innerHTML = '';
    
    if (mData && mData.names) {
        document.getElementById('detail-count').innerText = `共 ${mData.names.length} 穴`;
        mData.names.forEach((name, idx) => {
            const item = document.createElement('div');
            item.className = 'acupoint';
            item.innerHTML = `<span>${mData.id}${idx+1}</span>${name}`;
            listDiv.appendChild(item);
        });
    } else {
        document.getElementById('detail-count').innerText = '0 穴';
    }
}

function updateUI(index, continuousAngle) {
    const sc = SHICHEN[index];
    const prevIndex = (index - 1 + 12) % 12;
    const prevSc = SHICHEN[prevIndex];
    
    clockHand.style.transform = `translate(-50%, -100%) rotate(${continuousAngle}deg)`;

    const hexColor = '#' + sc.color.toString(16).padStart(6, '0');
    const curInfoEl = document.getElementById('cur-info');
    curInfoEl.innerText = `${sc.name} (${sc.zhi}时)`;
    curInfoEl.style.color = hexColor;

    document.getElementById('prev-info').innerText = `${prevSc.name} (${prevSc.zhi}时)`;
    document.getElementById('prev-info').style.color = '#' + prevSc.color.toString(16).padStart(6, '0');

    textElements.forEach((el, i) => {
        el.classList.remove('active', 'prev');
        if(i === index) {
            el.classList.add('active');
            el.style.setProperty('--active-color', hexColor);
        } else if (i === prevIndex) {
            el.classList.add('prev');
        }
    });

    M.forEach(m => {
        const group = groupsByM[m.id];
        if (m.id === sc.id) {
            group.children.forEach(child => {
                if(child.material.map) child.material.opacity = 1.0;
                else child.material.opacity = 0;
            });
        } else if (m.id === prevSc.id) {
            group.children.forEach(child => {
                if(child.material.map) child.material.opacity = 0;
                else child.material.opacity = 0.6;
            });
        } else {
            group.children.forEach(child => {
                if(child.material.map) child.material.opacity = 0;
                else child.material.opacity = 0;
            });
        }
    });

    renderDetail(sc);
}

let isDraggingClock = false;
let lastMouseAngle = 0;
let totalAngleRotated = 60; 

function getMouseAngle(clientX, clientY) {
    const rect = clockContainer.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dx = clientX - centerX;
    const dy = clientY - centerY;
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    angle = angle + 90; 
    return angle;
}

function handleDrag(clientX, clientY) {
    const curAngle = getMouseAngle(clientX, clientY);
    let delta = curAngle - lastMouseAngle;

    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    totalAngleRotated += delta;
    lastMouseAngle = curAngle;

    clockHand.style.transform = `translate(-50%, -100%) rotate(${totalAngleRotated}deg)`;

    let norm = totalAngleRotated % 360;
    if (norm < 0) norm += 360;

    let idx = Math.round(norm / 30) % 12;

    if (idx !== currentIndex) {
        currentIndex = idx;
        updateUI(currentIndex, totalAngleRotated);
    }
}

clockContainer.addEventListener('mousedown', (e) => {
    isDraggingClock = true;
    lastMouseAngle = getMouseAngle(e.clientX, e.clientY);
    totalAngleRotated = currentIndex * 30; 
});

window.addEventListener('mousemove', (e) => {
    if(isDraggingClock) handleDrag(e.clientX, e.clientY);
});

window.addEventListener('mouseup', () => { isDraggingClock = false; });

clockContainer.addEventListener('touchstart', (e) => {
    isDraggingClock = true;
    lastMouseAngle = getMouseAngle(e.touches[0].clientX, e.touches[0].clientY);
    totalAngleRotated = currentIndex * 30;
}, {passive: true});

window.addEventListener('touchmove', (e) => {
    if(isDraggingClock) handleDrag(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: true});

window.addEventListener('touchend', () => { isDraggingClock = false; });

clockContainer.addEventListener('wheel', (e) => {
    if(e.deltaY > 0) totalAngleRotated += 30;
    else totalAngleRotated -= 30;
    
    let norm = totalAngleRotated % 360;
    if(norm < 0) norm += 360;
    currentIndex = Math.round(norm / 30) % 12;
    updateUI(currentIndex, totalAngleRotated);
    e.preventDefault();
}, {passive: false});

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const sc = SHICHEN[currentIndex];
    if(flowTextures[sc.id]) {
        flowTextures[sc.id].forEach(tex => {
            tex.offset.x -= 0.015; 
        });
    }
    
    renderer.render(scene,camera);
}

resize();
updateUI(2, 60); 
animate();
</script>
